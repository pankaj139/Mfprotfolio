name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/deploy-backend.yml"

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: python -m py_compile main.py auth.py database.py models.py schemas.py

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Deploy via Render hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Render deploy hook returned HTTP $STATUS"
            exit 1
          fi
          echo "Render deploy triggered successfully (HTTP $STATUS)"
